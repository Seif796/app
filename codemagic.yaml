workflows:
  ios-workflow:
    name: Build iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Run Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --workspace "ios/*.xcworkspace" \
            --scheme "app"
    artifacts:
      - build/ios/ipa/*.ipa
